name: friends-private-osu

services:
  app:
    # or use
    # image: mingxuangame/g0v0-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osu_api_server
    expose:
      - "8000"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      # The application never administers MySQL. Keep the root credential in
      # the mysql container even though the rest of its settings come from .env.
      - MYSQL_ROOT_PASSWORD=
      - REDIS_URL=redis://redis:6379
      - CALCULATOR_CONFIG={"server_url":"http://performance-server:8080"}
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      performance-server:
        condition: service_started
    volumes:
      - ./replays:/app/replays
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./config:/app/config
      - ./plugins:/app/plugins
      # Compatibility modules are data, not application code. Publishing a
      # newly tested lazer version therefore does not require rebuilding the
      # API image; the switcher discovers it through /client/manifest.json.
      - ./static/client:/app/static/client:ro
    restart: unless-stopped
    networks:
      - osu-network

  mysql:
    image: mysql:8.0
    container_name: osu_api_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s
    restart: unless-stopped
    networks:
      - osu-network

  spectator:
    # SOMS! patches over the verified pinned runtime; dependencies stay identical.
    image: soms-spectator:local
    build:
      context: ../.sources/osu-server-spectator/osu.Server.Spectator
      dockerfile: Dockerfile.soms
    environment:
      # This spectator version parses bool values; "1" disables replay storage.
      - SAVE_REPLAYS=${SAVE_REPLAYS:-true}
      - REPLAY_UPLOAD_THREADS=${REPLAY_UPLOAD_THREADS:-1}
      # Allow rematches on a small server without the upstream ten-minute wait.
      - MATCHMAKING_RECENT_MATCHUP_TIMEOUT=${MATCHMAKING_RECENT_MATCHUP_TIMEOUT:-30}
      - SOMS_DODGE_OUTBOX=/data/soms/ranked-dodges
      - TRACK_BUILD_USER_COUNTS=${TRACK_BUILD_USER_COUNTS:-}
      - SERVER_PORT=${SERVER_PORT:-80}
      - REDIS_HOST=redis
      # The GooGuTeam image names this setting SP_SENTRY_DSN. Use the reserved
      # .invalid domain so private-server events never leave the container.
      - SP_SENTRY_DSN=${SP_SENTRY_DSN:-https://0123456789abcdef0123456789abcdef@sentry.invalid/1}
      - SHARED_INTEROP_DOMAIN=http://app:8000
      - SHARED_INTEROP_SECRET=${SHARED_INTEROP_SECRET:-}
      # Support both the g0v0 image aliases and the upstream spectator names.
      # Only the unprivileged application DB account is exposed here.
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - OSU_CLIENT_ID=${OSU_CLIENT_ID:-5}
    depends_on:
      - app
      - mysql
      - redis
    restart: unless-stopped
    volumes:
      - ./rulesets:/data/rulesets
      - spectator_state:/data/soms
    networks:
      - osu-network

  nginx:
    image: nginx:1.25-alpine
    ports:
      # Caddy/TLS is the only public entrypoint. Keep the raw proxy local so
      # clients cannot bypass HTTPS or the external /_lio deny rule.
      - "127.0.0.1:8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - spectator
    restart: unless-stopped
    networks:
      - osu-network

  redis:
    image: redis:7-alpine
    container_name: osu_api_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5
      interval: 10s
      start_period: 10s
    restart: unless-stopped
    networks:
      - osu-network
    command: redis-server --appendonly yes

  performance-server:
    # Pinned 2026-09-04 so PP does not silently change on container restart.
    image: ghcr.io/googuteam/osu-performance-server:latest@sha256:ec869687d1d5f2da59a0b7cc69a958a60bda3533ff4fb18c2815265519a7ddda
    container_name: performance_server
    environment:
      - SAVE_BEATMAP_FILES=false
    volumes:
      - ./rulesets:/data/rulesets
    restart: unless-stopped
    networks:
      - osu-network

volumes:
  # Keep the historical names used when this repository was started manually
  # from the server directory. Changing the one-click Compose project name must
  # not make an existing database appear empty.
  mysql_data:
    name: server_mysql_data
  redis_data:
    name: server_redis_data
  spectator_state:
    name: server_spectator_state

networks:
  osu-network:
    driver: bridge
