map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Caddy is the only public ingress. Preserve its HTTPS marker while refusing
# arbitrary forwarded values; direct loopback requests remain http.
map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $scheme;
    https   https;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # 屏蔽 /_lio/ 及其所有子路径的外部访问
    location ~ ^/_lio(?:/|$) {
        return 403;
    }

    location /signalr/ {
        proxy_pass http://spectator/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;

        proxy_set_header Authorization $http_authorization;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
        proxy_cache_bypass $http_upgrade;

        proxy_buffering off;
    }


    location / {
        proxy_pass http://app:8000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
        proxy_cache_bypass $http_upgrade;

        proxy_buffering off;
    }
}
